plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultimatemods'
    compileSdk 34

    defaultConfig {
        applicationId "com.ultimatemods.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
